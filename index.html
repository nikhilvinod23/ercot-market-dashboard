<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERCOT | Market dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#overview">ERCOT <span>Market dashboard</span></a>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <span id="feed-status">Loading market data…</span
        ><small>Central Time · ERCOT / EIA / Open-Meteo</small>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <h1 id="page-title">Overview</h1>
          <span id="as-of">Connecting…</span>
        </div>
        <div class="toolbar">
          <select id="day" aria-label="Operating day"></select
          ><button id="refresh">Refresh</button>
        </div>
      </header>
      <div id="notice" role="status" hidden></div>
      <div id="content">
        <div class="loading">Loading ERCOT market data…</div>
      </div>
      <footer>
        <span id="history-status"></span
        ><button id="export">Export history</button>
      </footer>
    </main>
    <div id="tooltip" role="status"></div>
    <script src="analytics.js"></script>
    <script src="charts.js"></script>
    <script src="maps.js"></script>
    <script src="app.js"></script>
  </body>
</html>
