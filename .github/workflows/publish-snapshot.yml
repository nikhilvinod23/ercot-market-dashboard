name: Publish saved market snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-monitoring
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ercot-market-monitoring
      - uses: actions/checkout@v4
        with:
          ref: market-data
          path: state
      - name: Use the most recent saved edition
        run: cp -R state/public/data/. public/data/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build saved public snapshot
        env:
          NEXT_PUBLIC_BASE_PATH: /ercot-market-dashboard
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
        id: deploy
