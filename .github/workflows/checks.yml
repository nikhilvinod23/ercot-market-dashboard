name: Dashboard checks
on:
  push:
    branches: [codex/ercot-api-validation, ercot-market-monitoring]
  pull_request:
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test analytics.test.js
      - run: node --check app.js && node --check extensions.js && node --check charts.js && node --check maps.js
