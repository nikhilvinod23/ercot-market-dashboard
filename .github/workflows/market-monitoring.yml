name: Collect and publish ERCOT dashboard
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish quickly using the last saved ERCOT snapshot
        type: boolean
        default: true
  repository_dispatch:
    types: [collector_tick]
  push:
    branches: [ercot-market-monitoring]
    paths-ignore: ["docs/**", "README.md"]
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-monitoring
  cancel-in-progress: false
jobs:
  collect-and-publish:
    if: github.event_name != 'schedule' || vars.ERCOT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLISH_ONLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only) }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: env.PUBLISH_ONLY == 'true'
        with:
          ref: market-data
          path: state
          sparse-checkout: public/data
          persist-credentials: false
      - uses: actions/checkout@v4
        if: env.PUBLISH_ONLY != 'true'
        with:
          ref: market-data
          path: state
      - uses: actions/setup-python@v5
        if: env.PUBLISH_ONLY != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the consolidated observation archive
        if: env.PUBLISH_ONLY != 'true'
        run: |
          mkdir -p archive public/data runtime-data
          python -m pipeline.state restore
          if [ -d state/raw ]; then cp -R state/raw archive/raw; fi
          if [ -d state/public/data ]; then cp -R state/public/data/. public/data/; fi
          if [ -d state/enrichment ]; then cp -R state/enrichment/. runtime-data/; fi
          if [ -f state/resource-mapping.json ]; then cp state/resource-mapping.json archive/resource-mapping.json; fi
          if [ -f state/kalshi-markets.json ]; then cp state/kalshi-markets.json archive/kalshi-markets.json; fi
      - name: Verify market calculations
        if: env.PUBLISH_ONLY != 'true'
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --test analytics.test.js
          node --check app.js
          node --check extensions.js
          node --check predictions.js
      - name: Collect official observations, forecasts, maps and fuel prices
        if: env.PUBLISH_ONLY != 'true'
        env:
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBSCRIPTION_KEY }}
          ERCOT_USERNAME: ${{ secrets.ERCOT_USERNAME }}
          ERCOT_PASSWORD: ${{ secrets.ERCOT_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.collect --history-days 7
      - name: Restore the last published market snapshot
        if: env.PUBLISH_ONLY == 'true'
        run: |
          test -s state/public/data/dashboard.json || {
            echo "::error::No saved market snapshot. Run again with publish_only disabled."
            exit 1
          }
          mkdir -p public/data
          cp -R state/public/data/. public/data/
      - name: Package both dashboards
        env:
          EUROPE_API_URL: ${{ vars.EUROPE_API_URL }}
        run: node build.js
      - name: Preserve observation history and map captures
        if: env.PUBLISH_ONLY != 'true'
        run: |
          python -m pipeline.state save
          mkdir -p state/raw state/public/data state/enrichment
          cp -R archive/raw/. state/raw/
          cp -R public/data/. state/public/data/
          cp -R runtime-data/. state/enrichment/
          if [ -f archive/resource-mapping.json ]; then cp archive/resource-mapping.json state/resource-mapping.json; fi
          if [ -f archive/kalshi-markets.json ]; then cp archive/kalshi-markets.json state/kalshi-markets.json; fi
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          cutoff=(datetime.now(timezone.utc)-timedelta(days=30)).date().isoformat()
          for folder in Path('state/raw').glob('*'):
              if folder.is_dir() and folder.name<cutoff:
                  for p in folder.glob('*.json.gz'): p.unlink()
                  if not any(folder.iterdir()): folder.rmdir()
          current={p.name for p in Path('public/data/reports').glob('*.json')}
          for p in Path('state/public/data/reports').glob('*.json'):
              if p.name not in current:p.unlink()
          PY
          cd state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Archive consolidated ERCOT market observations'; git push origin HEAD:market-data; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Wait for GitHub to index the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for attempt in {1..24}; do
            if visible=$(gh api "$endpoint" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$visible" -eq 1 ]; then exit 0; fi
              if [ "$visible" -gt 1 ]; then
                echo "::error::More than one active github-pages artifact exists for this run."
                exit 1
              fi
            fi
            echo "Waiting for the github-pages artifact ($attempt/24)."
            sleep 5
          done
          echo "::error::GitHub did not list the uploaded github-pages artifact within two minutes."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Check the public Rebase connection
        if: env.PUBLISH_ONLY == 'true'
        continue-on-error: true
        env:
          EUROPE_API_URL: ${{ vars.EUROPE_API_URL }}
        run: |
          node --input-type=module <<'JS'
          const endpoint = process.env.EUROPE_API_URL || "https://european-power-dashboard-api.nikhilvinod23.workers.dev/api/dashboard";
          const responses = await Promise.allSettled([0,1,2].map(async partition => {
            const url = new URL(endpoint);
            url.search = new URLSearchParams({ mode: "rebase", zone: "DE-LU", partition });
            const response = await fetch(url, { headers: { Origin: "https://nikhilvinod23.github.io" }, signal: AbortSignal.timeout(70000) });
            const data = await response.json();
            if (!response.ok) throw Error(`Partition ${partition}: HTTP ${response.status}. ${data.error ?? ""}`);
            const zones = Object.keys(data.zones ?? {}).length;
            if (!zones) throw Error(`Partition ${partition}: no market zones received.`);
            console.log(`Partition ${partition}: ${zones} market zones.`);
          }));
          for (const result of responses) if (result.status === "rejected") {
            console.error(result.reason.message);
            process.exitCode = 1;
          }
          JS
      - name: Retain failed-run data for recovery
        if: failure() && env.PUBLISH_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collector-recovery-${{ github.run_id }}
          path: |
            archive/market.sqlite
            archive/kalshi-markets.json
            public/data/
          retention-days: 7
