name: Collect and publish ERCOT dashboard
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-monitoring
  cancel-in-progress: false
jobs:
  collect-and-publish:
    if: github.event_name != 'schedule' || vars.ERCOT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: market-data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the consolidated observation archive
        run: |
          mkdir -p archive public/data runtime-data
          python -m pipeline.state restore
          if [ -d state/raw ]; then cp -R state/raw archive/raw; fi
          if [ -d state/public/data ]; then cp -R state/public/data/. public/data/; fi
          if [ -d state/enrichment ]; then cp -R state/enrichment/. runtime-data/; fi
          if [ -f state/resource-mapping.json ]; then cp state/resource-mapping.json archive/resource-mapping.json; fi
      - name: Verify market calculations
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --test analytics.test.js
          node --check app.js
          node --check extensions.js
      - name: Collect official observations, forecasts, maps and fuel prices
        env:
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBSCRIPTION_KEY }}
          ERCOT_USERNAME: ${{ secrets.ERCOT_USERNAME }}
          ERCOT_PASSWORD: ${{ secrets.ERCOT_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.collect --history-days 7
      - name: Package the single dashboard
        run: node build.js
      - name: Preserve observation history and map captures
        run: |
          python -m pipeline.state save
          mkdir -p state/raw state/public/data state/enrichment
          cp -R archive/raw/. state/raw/
          cp -R public/data/. state/public/data/
          cp -R runtime-data/. state/enrichment/
          if [ -f archive/resource-mapping.json ]; then cp archive/resource-mapping.json state/resource-mapping.json; fi
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          cutoff=(datetime.now(timezone.utc)-timedelta(days=30)).date().isoformat()
          for folder in Path('state/raw').glob('*'):
              if folder.is_dir() and folder.name<cutoff:
                  for p in folder.glob('*.json.gz'): p.unlink()
                  if not any(folder.iterdir()): folder.rmdir()
          current={p.name for p in Path('public/data/reports').glob('*.json')}
          for p in Path('state/public/data/reports').glob('*.json'):
              if p.name not in current:p.unlink()
          PY
          cd state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Archive consolidated ERCOT market observations'; git push origin HEAD:market-data; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
