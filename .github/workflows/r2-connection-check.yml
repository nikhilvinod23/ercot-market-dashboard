name: R2 connection check
on:
  push:
    branches: [codex/r2-connection-check]
    paths: [.github/workflows/r2-connection-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret names without revealing values
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All four required secret names are available to this workflow."
      - name: Install S3 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify read-only access to the selected R2 bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4", retries={"max_attempts": 2}),
          )
          try:
              result = client.list_objects_v2(
                  Bucket=os.environ["R2_BUCKET"], MaxKeys=1
              )
          except (BotoCoreError, ClientError) as exc:
              code = getattr(exc, "response", {}).get("Error", {}).get("Code", type(exc).__name__)
              raise SystemExit(f"R2 read-only check failed ({code}); values were not printed.")
          print("R2 credentials accepted; bucket is accessible for read-only listing.")
          print(f"Bucket contains objects: {'yes' if result.get('KeyCount', 0) else 'no'}")
          PY
