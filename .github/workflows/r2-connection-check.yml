name: R2 connection check
on:
  push:
    branches: [codex/r2-connection-check]
    paths: [.github/workflows/r2-connection-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret names without revealing values
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All four required secret names are available to this workflow."
      - name: Install S3 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify write, read, and delete permissions with a disposable canary
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import uuid
          import boto3
          from botocore.config import Config
          from botocore.exceptions import BotoCoreError, ClientError

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4", retries={"max_attempts": 2}),
          )
          bucket = os.environ["R2_BUCKET"]
          key = "connection-check/" + str(uuid.uuid4()) + ".txt"
          payload = b"ERCOT R2 disposable permission check"
          wrote = False
          try:
              client.put_object(Bucket=bucket, Key=key, Body=payload)
              wrote = True
              result = client.get_object(Bucket=bucket, Key=key)
              with result["Body"] as body:
                  if body.read() != payload:
                      raise SystemExit("R2 canary read-back did not match.")
              print("R2 canary upload and read-back succeeded.")
          except (BotoCoreError, ClientError) as exc:
              code = getattr(exc, "response", {}).get("Error", {}).get("Code", type(exc).__name__)
              raise SystemExit(f"R2 canary check failed ({code}); credential values were not printed.")
          finally:
              if wrote:
                  try:
                      client.delete_object(Bucket=bucket, Key=key)
                  except (BotoCoreError, ClientError) as exc:
                      code = getattr(exc, "response", {}).get("Error", {}).get("Code", type(exc).__name__)
                      raise SystemExit(f"R2 canary could not be deleted ({code}); remove {key} from the bucket manually.")
          try:
              client.head_object(Bucket=bucket, Key=key)
          except ClientError as exc:
              if exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode") == 404:
                  print("R2 canary deletion verified; bucket is clean.")
              else:
                  raise SystemExit("Could not verify R2 canary deletion.")
          else:
              raise SystemExit("R2 canary still exists; remove it before continuing.")
          PY
